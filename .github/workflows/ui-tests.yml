name: UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: docker/ui-tests.Dockerfile
          push: true
          tags: |
            ghcr.io/windnoise0/db-test-ui:latest
            ghcr.io/windnoise0/db-test-ui:${{ github.sha }}

  ui-tests:
    needs: build-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/windnoise0/db-test-ui:${{ github.sha }}
    env:
      UI_USERNAME: ${{ secrets.UI_USERNAME }}
      UI_PASSWORD: ${{ secrets.UI_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Run UI tests
        run: pytest tests/ui/test_network_mocking.py -n 2

      - uses: actions/setup-node@v7
        if: always()
        with:
          node-version: 22

      - name: Generate Allure report
        if: always()
        run: npx --yes allure generate ./allure-results

      - name: Upload Allure report (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          retention-days: 2

      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Upload Playwright artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: artifacts/

  deploy-report:
    needs: ui-tests
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5